name: ingestx-prod

# Production stack — use with a filled .env.production (see DEPLOYMENT.md)
#
#   cp .env.production.example .env.production
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Scale workers:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --scale worker=3

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      sh -c "redis-server --appendonly yes
      ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}"
    volumes:
      - prod_redisdata:/data
    healthcheck:
      test: >
        sh -c "redis-cli ${REDIS_PASSWORD:+-a $REDIS_PASSWORD} ping | grep PONG"
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      WS_AUTH_TOKEN: ${WS_AUTH_TOKEN}
      CORS_ORIGINS: ${CORS_ORIGINS}
      API_WORKERS: ${API_WORKERS:-2}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RUN_DB_MIGRATIONS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint: ["./scripts/entrypoint-worker.sh"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'rq worker' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      RUN_DB_MIGRATIONS: "false"
      RQ_QUEUE_NAME: ${RQ_QUEUE_NAME:-webhook_events}
    depends_on:
      api:
        condition: service_healthy

  outbox-retry:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint: []
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'wait_for_services\\|retry_outbox' >/dev/null || pgrep -f python >/dev/null || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      RUN_DB_MIGRATIONS: "false"
    command: >
      sh -c "python scripts/wait_for_services.py &&
      while true; do
        python -c 'from workers.tasks import retry_outbox_events; retry_outbox_events()';
        sleep $${OUTBOX_RETRY_INTERVAL:-30};
      done"
    depends_on:
      api:
        condition: service_healthy

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        VITE_STREAM_TOKEN: ${WS_AUTH_TOKEN}
        VITE_MERCHANT_ID: ${DEFAULT_MERCHANT_ID:-merchant_demo}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - dashboard

volumes:
  prod_pgdata:
  prod_redisdata:
  caddy_data:
  caddy_config:
